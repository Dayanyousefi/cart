# =============================================================================
# Nginx Reverse Proxy Configuration — پلتفرم دعوتنامه دیجیتال «ایوان»
# مسیردهی بهینه‌شده برای صفحات عمومی دعوتنامه (/i/:slug) و API (/api/v1/*)
# =============================================================================

upstream eyvan_app_upstream {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost example.ir;

    client_max_body_size 6M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for fast loading on Iranian mobile networks
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Public Invitation Pages (/i/:slug)
    location ^~ /i/ {
        proxy_pass http://eyvan_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API Endpoints (/api/v1/*)
    location ^~ /api/ {
        proxy_pass http://eyvan_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Application & Assets
    location / {
        proxy_pass http://eyvan_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
